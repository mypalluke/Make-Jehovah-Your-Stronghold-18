  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const appId = typeof __app_id !== 'undefined' ? __app_id : 'stronghold-talk-app';
    let firebaseConfig = null;
    try {
      if (typeof __firebase_config !== 'undefined') {
        firebaseConfig = JSON.parse(__firebase_config);
      }
    } catch(e) { 
      console.error("Firebase config parse error", e); 
    }

    window.initFirebaseSync = async (onDataReceived) => {
      if (!firebaseConfig) {
        console.log("No Firebase credentials supplied. Using local device state.");
        return;
      }
      try {
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }

        const userId = auth.currentUser?.uid;
        if (!userId) return;

        // Ensure we follow Rule 1 for private user data
        const docRef = doc(db, 'artifacts', appId, 'users', userId, 'talk_settings', 'stronghold_v1');

        onSnapshot(docRef, (snapshot) => {
          if (snapshot.exists()) {
            onDataReceived(snapshot.data());
          }
        }, (err) => {
          console.error("Firestore sync error:", err);
        });

        window.saveTalkDataToCloud = async (data) => {
          if (!auth.currentUser) return;
          try {
            await setDoc(docRef, data, { merge: true });
          } catch(e) {
            console.error("Cloud save failed:", e);
          }
        };
      } catch (err) {
        console.error("Firebase initialization failed:", err);
      }
    };
  </script>

    const DEFAULT_SCRIPTS = {
      i1: `Picture yourself at a park on a warm afternoon. You are having a wonderful time with family and friends—picnicking, throwing a ball around, laughing, and relaxing.\n\nOff in the distance, the sky turns dark and thunder rumbles. But then, a cool, refreshing breeze sweeps across the field. It feels fantastic after the heat of the day! You think to yourself: "Ah, I don't want to pack up yet. It feels so nice out! Just a few more minutes."\n\nSo you keep playing. But that cool breeze is deceptive—it’s the front of a dangerous storm cell. Within moments, gale-force winds hit, the sky turns pitch black, and heavy rain pours down.`,
      i2: `Caught out in the open as the skies open up, where do you run?\n\nOption 1: Right nearby in the park is an open picnic pavilion. It has a roof, it’s close, and it takes very little effort to reach.\n\nOption 2: Down the road, however, is a sturdy, enclosed brick building. You'll have to run through the rain to get to it, but it has a solid foundation and four walls.\n\nMany people run straight for the pavilion because it looks like shelter. But anyone trained in severe weather knows that an open-sided shelter during a lightning storm is a dangerous illusion. It might keep the drizzle off your head for a moment, but with no walls, lightning can strike the roof, travel down the posts, and arc across the wet concrete floor to anyone standing inside. The enclosed building takes effort to reach, but it is the only structure with the foundation and solid walls required to keep you alive.`,
      i3: `A far greater storm is on the horizon—the Great Tribulation.\n\nJehovah’s forecast in scripture is certain: the destruction of false religion, an attack by a coalition of nations on God’s people, and the final war of Armageddon.\n\nWhen that storm hits, where will you be standing? Will you be lulled by the temporary, comfortable "breezes" of this world, sitting on the picnic blanket until it’s too late? Or will you be safely inside Jehovah’s solid fortress?`,
      f1: `Notice how mankind in general will react when that storm hits:\n\n(READ) Revelation 6:16, 17:\n"And they keep saying to the mountains and to the rocks: 'Fall over us and hide us from the face of the One seated on the throne and from the wrath of the Lamb, because the great day of their wrath has come, and who is able to stand?'"\n\nPeople will panic, running to whatever human organizations or political systems look big and convenient. That is like running into that open picnic pavilion. It looks substantial from a distance, and it feels easy in the moment, but without solid walls, it offers zero defense against the wrath of the Lamb. They ask a critical question: "Who is able to stand?"`,
      f2: `The Bible gives us the comforting answer:\n\n(READ) Nahum 1:6, 7:\n\n"Who can stand before his indignation? And who can withstand the heat of his anger?... Jehovah is good, a stronghold in the day of distress. He is mindful of those seeking refuge in him."\n\nJehovah is an unshakeable stronghold.  What is a stronghold? It isn't a temporary tent or a flimsy umbrella; it is a permanent, heavily fortified structure designed to withstand the most violent assaults. \n\nNotice again what Nahum says: 'Jehovah is good, a stronghold in the day of distress. He is mindful of those seeking refuge in him.' Jehovah is mindful of those who are seeking him. That makes this very personal.\n\nPicture that storm again. The sky suddenly turns black. Lightning strikes a tree just a short distance away. And in that instant, someone who had been sitting comfortably outside realizes: 'I should have gone into the brick house.'\n\nMaybe there is still an opportunity to run. Maybe the door is still open. But now the situation is completely different. The person isn't calmly walking toward shelter anymore. They're running through a violent storm, with lightning striking around them.\n\nWould you really want to wait until that moment to decide whether Jehovah is your stronghold? Why take that risk? Jehovah is already telling us where the safe place is. He is already inviting those seeking refuge in him to come to him. The time to make Jehovah our stronghold is now—not when the first lightning strikes.`,
      f3: `And that's why what we do today matters so much. We don't want our first real test of trust in Jehovah to come when the storm is already overhead. Jesus said at Luke 16:10:\n"The person faithful in what is least is faithful also in much."\n\nSmall decision → repeated habit → established character → bigger test.\n\nEvery small decision to obey Jehovah is a kind of spiritual training. When we choose honesty when dishonesty would be easier, when we control our thoughts when nobody else would know, when we forgive instead of holding onto resentment, when we put spiritual things first even when we're tired—those may seem like small decisions. But they're building something inside us.\n\nSo when Jesus said that the person faithful in what is least is faithful also in much, he was highlighting a principle that can prepare us for something much bigger. We don't suddenly develop strong faith when a major test arrives. We reveal the faith we've been building all along.\n\nWe don't build our relationship with Jehovah when the biggest test of faith arrives. We build it through the small decisions we make every day. So how can we make Jehovah our stronghold now? Let's consider three areas where those daily decisions matter.`,
      w1: `(READ) Proverbs 10:29a:\n"The way of Jehovah is a stronghold for the blameless one..."\n\nJehovah's moral laws form the solid, impenetrable walls of our stronghold. Staying inside guarantees safety. But stepping outside these boundaries—relying on human moral thinking—is like opening the heavy fortress door and walking unprotected into the freezing rain.\n\nNotice how subtly the world tries to lure us outside. Society continually redefines morality to make it comfortable. People rarely say someone is "living in sin"—they say they are "cohabitating." It’s no longer called "adultery"—it’s "having an affair." It’s not "homosexuality"—it’s an "alternative lifestyle."\n\nBut the real question is: What terminology and thinking am I allowing to shape my own thinking? When we adopt this slick, soft language, we slowly weaken our moral defenses.\n\nColossians 3:5 urges us to "Deaden, therefore, your body members..." Jesus used vivid language when he said that if your hand makes you stumble, cut it off (Mark 9:43). He wasn't talking about literal self-mutilation; he was talking about radical, decisive action in our daily choices.\n\nIf you are single, do you view dating as casual recreation, or are you guarding your moral boundaries today? [PAUSE for 3 seconds]\n\nIf you are married, do you reject subtle flirting or the private trap of pornography? [PAUSE for 3 seconds]\n\nDeadening sinful desires feels hard if we try to do it alone. But when we pray, read God's Word daily, and stay close to the congregation, Jehovah gives us the strength to remain blameless inside his stronghold.`,
      w2: `(READ) Proverbs 18:11:\n"The wealth of the rich is his fortified city; it is like a protective wall in his imagination."\n\nNotice that last expression: "in his imagination."\n\nMoney can certainly provide a measure of security. Having savings can help us through an unexpected repair, a period of unemployment, or a serious financial setback. So the Bible isn't teaching that having money is inherently wrong.\n\nBut money cannot be our ultimate stronghold.\n\nIt may help us through a storm—but it cannot protect us from every storm. And it certainly cannot save us when Jehovah's judgment comes.\n\nThere is another danger that may be even more subtle.\n\nIt isn't just having wealth that can become a problem. It is what we are willing to do to get more of it.\n\nA brother who served in Thailand told me something that really stayed with me. He has heard brothers and sisters there pray that those of us who live with greater material abundance will not be overtaken by our wealth.\n\nThink about that.\n\nThey can see through the internet what is available in other parts of the world. With a smartphone, someone living with relatively little can see beautiful homes, expensive cars, vacations, technology, and all kinds of material comforts.\n\nNaturally, some may begin to think, "I want that too."\n\nBut these brothers and sisters also recognize something important: having more does not necessarily mean being happier.\n\nAnd that is a warning worth taking seriously.\n\nBecause if we become determined to have more, we can gradually begin compromising in small things.\n\nFor example, think about our business dealings.\n\nWould we ever be tempted to exaggerate what we're selling?\n\nWould we be completely honest about the condition of something we're selling?\n\nWould we be tempted to cut a corner because being completely honest might cost us money?\n\nOr think about our dealings with the government.\n\nWhen we report our taxes, are we determined to be completely honest? Even when we think, "Everybody does it," or "It's only a little bit"?\n\nThose may seem like small matters.\n\nBut remember what Jesus said about being faithful in what is least.\n\nThe issue isn't simply the amount of money involved.\n\nThe issue is: Whose stronghold am I trusting?\n\nAm I willing to sacrifice some financial gain in order to maintain a clean conscience before Jehovah?\n\n(READ) Proverbs 11:1:\n"A dishonest scale is detestable to Jehovah, but an accurate weight brings him pleasure."\n\nIn Bible times, dishonest scales could allow a merchant to make a little extra money by giving a customer less than he had paid for.\n\nJehovah hated that kind of dishonesty.\n\nAnd he hasn't changed.\n\nSo whether we're dealing with a customer, an employee, a contractor, a business partner, the government, or anyone else, we want to be known as people who are honest in all things.\n\nThat may sometimes cost us money.\n\nIt may mean turning down an opportunity.\n\nIt may mean admitting a mistake instead of hiding it.\n\nIt may mean paying what we actually owe instead of looking for a way around it.\n\nBut that's precisely the point.\n\nWe don't want our desire for wealth to become stronger than our desire to please Jehovah.\n\nBecause wealth can give us options.\n\nIt can make difficult circumstances easier.\n\nIt can provide a measure of security.\n\nBut it cannot be our stronghold.\n\nAnd if pursuing it causes us to compromise our honesty—even in what seems like a little thing—we've begun building our security on the wrong foundation.\n\nSo let's be determined to conduct ourselves honestly in all things.\n\nJehovah—not wealth—is our stronghold.`,
      w3: `(READ) Proverbs 3:5, 6:\n"Trust in Jehovah with all your heart, and do not rely on your own understanding. In all your ways take notice of him, and he will make your paths straight."\n\nTaking notice of God "in all your ways" means his will isn't an afterthought—it is the lens through which we make every decision, big or small.\n\nAsk yourself honestly:\n• Do my daily schedules reflect that spiritual things come first? [PAUSE for 3 seconds]\n• Is personal Bible study and prayer a daily necessity? [PAUSE for 3 seconds]\n• Are congregation meetings and field ministry viewed as vital appointments?\n\nRemember the principle of Luke 16:10. Our daily priorities are another form of spiritual training. When major decisions arrive, our response is influenced by the priorities we have already established. We build a muscle memory of obedience.`,
      s1: `Making Jehovah our stronghold isn't just for the future—it protects us through the present-day trials of this system.\n\n(READ) Psalm 37:39, 40:\n"The salvation of the righteous is from Jehovah; he is their fortress in the time of distress. Jehovah will help them and rescue them... because they take refuge in him."\n\nLet's be clear: Jehovah being our stronghold does not mean that faithful Christians will never experience suffering. Running into the stronghold doesn't mean we won't get wet.\n\nIf we are caught outside when the storm begins, we may reach the door absolutely soaked. We may be cold, shaken, and exhausted. But there is a tremendous difference between being caught outside in the storm and being inside the stronghold.\n\nConsider the apostle Paul. He had a physical "thorn in the flesh." Jehovah did not miraculously remove the problem; he gave Paul the strength to endure it. Serious illness may still hurt, and aging may still be difficult. But Jehovah provides a safe place to recover, stabilize, and endure. Be realistic about your limitations, continue to be useful in Jehovah's service, and accept help from your fellow believers. Do not isolate yourself.`,
      s2: `Sometimes, the storm comes from within our own spiritual family. Imperfect human traits will occasionally clash, and hurt feelings happen.\n\nPicture this: You are running through a downpour toward that sturdy brick house, and someone accidentally bumps into you at the door. Do you stop in the pouring rain, stand on the doorstep, and start arguing about who had the right of way?\n\nOf course not! You both step inside the shelter together! Satan doesn't always need to blow the stronghold down; sometimes, he just needs to provoke our pride so we stand on the porch arguing.\n\nColossians 3:13 urges us: "Continue putting up with one another and forgiving one another freely..."\n\nAsk yourself: Do I want to be "right," or do I want to preserve peace and remain safely within Jehovah's arrangement?`,
      s3: `King David was hunted by King Saul, yet he made Jehovah his stronghold rather than trusting his own strength. We face opposition today, and sometimes, the heartbreak of a family member stepping off the safe path and wandering back out into the storm.\n\nIt causes immense heartache. But going out into the dark, slick terrain after them puts our own spiritual footing at risk.\n\nWe can continue loving them. We can pray for them. We can keep the door open. But we stay securely on Jehovah’s high ground, keeping the lights on and the stronghold warm, praying they will see it and choose to return.`,
      s4: `We've spent some time considering the coming storm and the importance of taking refuge in Jehovah now. But I don't want us to leave this talk thinking only about danger. The Bible also tells us something beautiful about what it's like to live under Jehovah's protection.\n\nNotice these words at Psalm 5:11, 12:\n\n(READ) Psalm 5:11, 12:\n"But all those who take refuge in you will rejoice; they will always shout joyfully. You will block approach to them, and those loving your name will rejoice in you. For you will bless anyone righteous, O Jehovah; you will surround them with approval as with a large shield."\n\nDid you notice how many times the thought of protection and security comes through?\n"Those who take refuge in you."\n"You will block approach to them."\n\nAnd then Jehovah says: "You will surround them with approval as with a large shield."\n\nThink about that for a moment. A shield doesn't mean the soldier never encounters an enemy. The shield means that when the attack comes, there is something between the person and the danger.\n\nIn the same way, making Jehovah our stronghold doesn't mean that we'll never experience hardship. We may still get wet in the storm. We may come through the door of that brick house sopping wet. But we're inside. We're somewhere safe. We can recover. We can be stabilized.\n\nAnd notice the first part of verse 11: "All those who take refuge in you will rejoice."\n\nThat's not the picture of someone hiding in terror, wondering whether Jehovah will abandon them. It's the picture of someone who has confidence in the one they've chosen as their refuge.\n\nJehovah is not simply the place we run to when we're scared. He is the one we can trust every day.`,
      c1: `A great spiritual storm is approaching. Picture the dark sky and the storm arriving. Now look at the inadequate open pavilion, and then look at the sturdy enclosed building.\n\nWhere am I standing now?\n\n• Am I relying on the world's temporary shelters—human wisdom, material security, worldly thinking, or personal independence?\n• Or am I inside Jehovah's stronghold—trusting him, obeying his moral standards, forgiving my brothers, and putting his will first?\n\nWe don't know exactly what every future storm will look like. But we know where the safe place is. The time to choose the stronghold is now.\n\nIf we make Jehovah our stronghold in the small decisions of life today, he will prove to be our refuge through today's storms, through the Great Tribulation, and into his peaceful new world.`
    };

    const FlashcardBubble = ({ card, textColor, borderColor, lightBg, onJumpToScript, isEditMode, onUpdateCard, onDeleteCard }) => {
      const [isPopped, setIsPopped] = useState(false);
      const [isPressing, setIsPressing] = useState(false);
      const pressTimer = useRef(null);
      const hasLongPressed = useRef(false);

      const startPress = () => {
        if (isEditMode) return;
        hasLongPressed.current = false;
        setIsPressing(true);
        pressTimer.current = setTimeout(() => {
          hasLongPressed.current = true;
          setIsPressing(false);
          if (navigator.vibrate) navigator.vibrate(50);
          onJumpToScript(card.id);
        }, 1200);
      };

      const cancelPress = () => {
        setIsPressing(false);
        clearTimeout(pressTimer.current);
      };

      const handleClick = () => {
        if (isEditMode || hasLongPressed.current) return;
        setIsPopped(!isPopped);
      };

      const holdStyles = isPressing ? 'scale-95 opacity-80 ring-4 ring-slate-500 transition-all duration-300' : 'transition-all duration-200 hover:-translate-y-1';

      if (isEditMode) {
        return (
          <div className="w-full max-w-2xl bg-slate-800 rounded-xl p-4 border-2 border-slate-700 shadow-md my-3 space-y-3 relative">
            <div className="flex justify-between items-center">
              <span className="text-xs font-bold text-slate-400 uppercase tracking-wide">Edit Card ({card.id})</span>
              <button 
                onClick={() => onDeleteCard(card.id)}
                className="text-rose-400 hover:text-rose-300 p-1 rounded hover:bg-slate-700 text-xs flex items-center gap-1"
              >
                <Trash2 className="w-4 h-4"/> Delete
              </button>
            </div>

            <div>
              <label className="block text-xs font-semibold text-slate-300 mb-1">Trigger / Title:</label>
              <input 
                type="text" 
                value={card.trigger} 
                onChange={(e) => onUpdateCard(card.id, { trigger: e.target.value })}
                className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white font-medium focus:ring-2 focus:ring-amber-500 focus:outline-none"
              />
            </div>

            <div>
              <label className="block text-xs font-semibold text-slate-300 mb-1">Bullet Points (one per line):</label>
              <textarea 
                rows="3"
                value={card.details.join('\n')} 
                onChange={(e) => onUpdateCard(card.id, { details: e.target.value.split('\n') })}
                className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-slate-200 text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none"
              />
            </div>
          </div>
        );
      }

      return (
        <div className="w-full flex justify-center relative my-3 group">
          {!isPopped ? (
            <div 
              onMouseDown={startPress}
              onMouseUp={cancelPress}
              onMouseLeave={cancelPress}
              onTouchStart={startPress}
              onTouchEnd={cancelPress}
              onTouchMove={cancelPress}
              onContextMenu={(e) => e.preventDefault()}
              onClick={handleClick}
              className={`
                cursor-pointer inline-flex items-center space-x-3 px-6 py-4 rounded-full
                ${lightBg} border-2 ${borderColor} shadow-lg 
                active:scale-95 select-none
                ${holdStyles}
              `}
            >
              <div className="p-2 rounded-full bg-slate-900/50">
                <MessageCircle className={`w-5 h-5 ${textColor}`} />
              </div>
              <span className={`font-semibold text-lg ${textColor} max-w-sm truncate sm:max-w-none`}>
                {card.trigger}
              </span>
            </div>
          ) : (
            <div 
              onMouseDown={startPress}
              onMouseUp={cancelPress}
              onMouseLeave={cancelPress}
              onTouchStart={startPress}
              onTouchEnd={cancelPress}
              onTouchMove={cancelPress}
              onContextMenu={(e) => e.preventDefault()}
              onClick={handleClick}
              className={`
              animate-pop-in cursor-pointer
              w-full max-w-2xl bg-slate-800 rounded-2xl shadow-2xl border-2 ${borderColor} p-6 relative overflow-hidden select-none
              ${holdStyles}
            `}>
              <div className={`absolute top-0 right-0 w-40 h-40 bg-gradient-to-br from-white/10 to-transparent rounded-full blur-3xl -mr-10 -mt-10 opacity-30 pointer-events-none`}></div>
              
              <div className="flex justify-between items-start mb-5 relative z-10">
                <div className="flex items-start space-x-3 pr-8">
                   <Lightbulb className={`w-6 h-6 mt-1 flex-shrink-0 ${textColor}`} />
                   <h3 className={`font-bold text-xl leading-tight ${textColor}`}>{card.trigger}</h3>
                </div>
              </div>
              
              <ul className="space-y-4 relative z-10">
                {card.details.map((detail, idx) => (
                  <li key={idx} className="flex items-start text-slate-300 text-lg sm:text-xl font-medium leading-relaxed">
                    <ChevronRight className={`w-6 h-6 mt-0.5 mr-3 flex-shrink-0 ${textColor} opacity-60`} />
                    <span>
                      {detail.split('*').map((chunk, i) => i % 2 !== 0 ? <strong key={i} className="text-white">{chunk}</strong> : chunk)}
                    </span>
                  </li>
                ))}
              </ul>
              
              <div className="mt-8 flex justify-between items-center relative z-10 border-t border-slate-700/50 pt-4">
                 <div className="text-xs text-slate-500 flex items-center">
                    <FileText className="w-3 h-3 mr-1"/> Hold for Script
                 </div>
                 <div className="flex items-center text-sm font-medium text-slate-400 opacity-80">
                   <CheckCircle2 className="w-4 h-4 mr-2" />
                   Tap to close
                 </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    const PresentationTimer = ({ totalMinutes, setTotalMinutes }) => {
      // Auto-start at the exact total minutes plus 30 seconds buffer
      const [seconds, setSeconds] = useState((totalMinutes * 60) + 30);
      const [isRunning, setIsRunning] = useState(true);
      const initialMount = useRef(true);

      // Only sync if totalMinutes changes through edit mode
      useEffect(() => {
        if (initialMount.current) {
          initialMount.current = false;
        } else {
          setSeconds(totalMinutes * 60);
        }
      }, [totalMinutes]);

      useEffect(() => {
        let interval;
        if (isRunning) {
          interval = setInterval(() => setSeconds(s => s - 1), 1000);
        }
        return () => clearInterval(interval);
      }, [isRunning]);

      const formatTime = (totalSeconds) => {
        const isOvertime = totalSeconds < 0;
        const absSecs = Math.abs(totalSeconds);
        const m = Math.floor(absSecs / 60);
        const s = absSecs % 60;
        return `${isOvertime ? '+' : ''}${m}:${s.toString().padStart(2, '0')}`;
      };

      const startTalk = () => { 
        setIsRunning(true); 
        setSeconds(totalMinutes * 60); 
      };
      
      const toggle = () => setIsRunning(!isRunning);
      const reset = () => { 
        setIsRunning(false); 
        setSeconds((totalMinutes * 60) + 30); 
      };

      const isOvertime = seconds < 0;
      const isLowTime = seconds >= 0 && seconds < 120;

      let timeColor = 'text-slate-100';
      if (isOvertime) timeColor = 'text-rose-500 animate-pulse font-extrabold';
      else if (isLowTime) timeColor = 'text-amber-400';

      return (
        <div className="bg-slate-800 border border-slate-700 text-white rounded-full shadow-lg px-3 py-1.5 sm:px-5 sm:py-2.5 flex items-center space-x-3 sm:space-x-5">
          <div className={`text-lg sm:text-2xl font-black tabular-nums tracking-tight min-w-[3.5rem] sm:min-w-[4.5rem] text-center ${timeColor}`}>
            {formatTime(seconds)}
          </div>
          
          <div className="flex items-center space-x-1 border-l border-slate-600 pl-3">
            <button 
              onClick={startTalk} 
              title={`Jump to ${totalMinutes}:00 and run`} 
              className="py-1.5 px-3 sm:py-2 sm:px-4 bg-amber-600 text-white rounded-full hover:scale-105 hover:bg-amber-500 transition-all text-[10px] sm:text-xs font-bold uppercase tracking-wider mr-1 shadow-md shadow-amber-900/50"
            >
              Start
            </button>
            <button onClick={toggle} title={isRunning ? "Pause" : "Play"} className="p-1.5 sm:p-2 bg-slate-700 text-slate-100 rounded-full hover:scale-105 hover:bg-slate-600 transition-all">
              {isRunning ? <Pause className="w-3.5 h-3.5 sm:w-4 sm:h-4" fill="currentColor" /> : <Play className="w-3.5 h-3.5 sm:w-4 sm:h-4" fill="currentColor" />}
            </button>
            <button onClick={reset} title="Reset (Adds 30s Buffer)" className="p-1.5 sm:p-2 text-slate-400 hover:text-white rounded-full transition-colors">
              <RotateCcw className="w-3.5 h-3.5 sm:w-4 sm:h-4" />
            </button>
          </div>
        </div>
      );
    };

    const FullScriptView = ({ outline, scripts, isEditMode, onUpdateScript, talkTitle }) => {
      return (
        <div className="max-w-3xl mx-auto px-4 pt-8 pb-32 text-lg sm:text-xl text-slate-300 leading-relaxed space-y-8 font-serif">
          
          <div className="text-center mb-10 font-sans border-b border-slate-700 pb-6">
            <h1 className="text-3xl font-bold text-white mb-2">{talkTitle}</h1>
            <h2 className="text-xl text-slate-400">Presentation Transcript</h2>
          </div>

          {outline.map((section) => (
            <div key={section.id} className="space-y-6 relative pb-6">
              <div className="sticky top-[56px] sm:top-[72px] z-40 bg-slate-900/95 backdrop-blur-md py-3 sm:py-4 -mx-4 px-4 sm:-mx-8 sm:px-8 border-b border-slate-800 shadow-md mb-6">
                <h3 className={`text-xl sm:text-2xl font-bold font-sans tracking-wider ${section.textColor}`}>
                  {section.sectionTitle}
                </h3>
              </div>

              {section.cards.map((card) => {
                const scriptText = scripts[card.id] || '';
                return (
                  <div key={card.id} id={card.id} className="scroll-mt-32 p-4 rounded-xl transition-colors duration-500">
                    <div className="font-sans text-sm font-bold text-slate-400 mb-2 flex items-center gap-2">
                      <span className="w-2 h-2 rounded-full bg-amber-500"></span>
                      {card.trigger}
                    </div>

                    {isEditMode ? (
                      <textarea
                        rows="6"
                        value={scriptText}
                        onChange={(e) => onUpdateScript(card.id, e.target.value)}
                        className="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-slate-100 font-serif text-base focus:ring-2 focus:ring-amber-500 focus:outline-none"
                      />
                    ) : (
                      <div className="whitespace-pre-wrap space-y-4">
                        {scriptText.split('\n\n').map((paragraph, pIdx) => {
                          if (paragraph.startsWith('(') && paragraph.endsWith(')')) {
                            return <p key={pIdx} className="text-amber-400/90 font-sans text-sm font-bold tracking-wide uppercase italic my-2">{paragraph}</p>;
                          }
                          if (paragraph.startsWith('"') || paragraph.startsWith('“')) {
                            return (
                              <blockquote key={pIdx} className="border-l-4 border-amber-500 pl-4 my-4 bg-slate-800/40 py-3 pr-3 rounded-r-lg text-slate-100 font-sans text-base sm:text-lg">
                                {paragraph}
                              </blockquote>
                            );
                          }
                          // Safely mapping the PAUSE emphasis
                          const parts = paragraph.split(/(\[PAUSE for 3 seconds\])/);
                          if (parts.length > 1) {
                            return (
                              <p key={pIdx}>
                                {parts.map((part, i) => 
                                  part === '[PAUSE for 3 seconds]' 
                                  ? <strong key={i} className="text-amber-500 bg-amber-500/10 px-2 py-0.5 rounded animate-pulse">{part}</strong>
                                  : part
                                )}
                              </p>
                            );
                          }
                          return <p key={pIdx}>{paragraph}</p>;
                        })}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          ))}
        </div>
      );
    };

    const App = () => {
      const [viewMode, setViewMode] = useState('mindmap'); // 'mindmap' | 'script'
      const [isEditMode, setIsEditMode] = useState(false);
      const [talkTitle, setTalkTitle] = useState(DEFAULT_TALK_TITLE);
      const [totalMinutes, setTotalMinutes] = useState(DEFAULT_TIME_MINUTES);
      const [outline, setOutline] = useState(DEFAULT_OUTLINE);
      const [scripts, setScripts] = useState(DEFAULT_SCRIPTS);
      const [showModal, setShowModal] = useState(false);
      const [toastMsg, setToastMsg] = useState(null);

      // --- PERSISTENCE: Sync state across reloads & cloud ---
      useEffect(() => {
        // 1. First load from device
        const savedData = localStorage.getItem('talk_app_data_stronghold');
        if (savedData) {
          try {
            const parsed = JSON.parse(savedData);
            if (parsed.talkTitle) setTalkTitle(parsed.talkTitle);
            if (parsed.totalMinutes) setTotalMinutes(parsed.totalMinutes);
            if (parsed.outline) setOutline(parsed.outline);
            if (parsed.scripts) setScripts(parsed.scripts);
          } catch(e) {
            console.error("Local state restore failed", e);
          }
        }

        // 2. Initialize Firebase realtime synchronization if available
        if (window.initFirebaseSync) {
          window.initFirebaseSync((cloudData) => {
            if (cloudData) {
              if (cloudData.talkTitle) setTalkTitle(cloudData.talkTitle);
              if (cloudData.totalMinutes) setTotalMinutes(cloudData.totalMinutes);
              if (cloudData.outline) setOutline(cloudData.outline);
              if (cloudData.scripts) setScripts(cloudData.scripts);
            }
          });
        }
      }, []);

      // --- WAKE LOCK (Keep screen awake) ---
      useEffect(() => {
        let wakeLock = null;

        const requestWakeLock = async () => {
          if ('wakeLock' in navigator) {
            try {
              wakeLock = await navigator.wakeLock.request('screen');
              console.log('Screen Wake Lock active');
              
              wakeLock.addEventListener('release', () => {
                console.log('Screen Wake Lock released');
              });
            } catch (err) {
              console.error(`Wake Lock error: ${err.name}, ${err.message}`);
            }
          }
        };

        // Request immediately on mount
        requestWakeLock();

        // Re-request when the app comes back to the foreground
        const handleVisibilityChange = () => {
          if (wakeLock !== null && document.visibilityState === 'visible') {
            requestWakeLock();
          }
        };

        document.addEventListener('visibilitychange', handleVisibilityChange);

        return () => {
          document.removeEventListener('visibilitychange', handleVisibilityChange);
          if (wakeLock !== null) {
            wakeLock.release();
          }
        };
      }, []);

      // Auto-save changes locally and to cloud
      const persistState = (newTitle, newMin, newOutline, newScripts) => {
        const payload = {
          talkTitle: newTitle,
          totalMinutes: newMin,
          outline: newOutline,
          scripts: newScripts,
          updatedAt: Date.now()
        };
        // Local Device Storage
        localStorage.setItem('talk_app_data_stronghold', JSON.stringify(payload));
        // Cloud Sync
        if (window.saveTalkDataToCloud) {
          window.saveTalkDataToCloud(payload);
        }
        showToast("Changes saved on this device!");
      };

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 3000);
      };

      // --- EDIT HANDLERS ---
      const handleUpdateCard = (cardId, updatedFields) => {
        const newOutline = outline.map(sec => ({
          ...sec,
          cards: sec.cards.map(c => c.id === cardId ? { ...c, ...updatedFields } : c)
        }));
        setOutline(newOutline);
        persistState(talkTitle, totalMinutes, newOutline, scripts);
      };

      const handleDeleteCard = (cardId) => {
        const newOutline = outline.map(sec => ({
          ...sec,
          cards: sec.cards.filter(c => c.id !== cardId)
        }));
        setOutline(newOutline);
        persistState(talkTitle, totalMinutes, newOutline, scripts);
      };

      const handleAddCard = (sectionId) => {
        const newCardId = 'custom_' + Date.now().toString().slice(-4);
        const newCard = {
          id: newCardId,
          trigger: 'New Point / Trigger',
          details: ['Key thought bullet 1', 'Key thought bullet 2']
        };
        const newOutline = outline.map(sec => {
          if (sec.id === sectionId) {
            return { ...sec, cards: [...sec.cards, newCard] };
          }
          return sec;
        });
        const newScripts = { ...scripts, [newCardId]: 'Enter spoken script content for this point here...' };
        setOutline(newOutline);
        setScripts(newScripts);
        persistState(talkTitle, totalMinutes, newOutline, newScripts);
      };

      const handleUpdateScript = (cardId, text) => {
        const newScripts = { ...scripts, [cardId]: text };
        setScripts(newScripts);
        persistState(talkTitle, totalMinutes, outline, newScripts);
      };

      const handleResetDefault = () => {
        setTalkTitle(DEFAULT_TALK_TITLE);
        setTotalMinutes(DEFAULT_TIME_MINUTES);
        setOutline(DEFAULT_OUTLINE);
        setScripts(DEFAULT_SCRIPTS);
        persistState(DEFAULT_TALK_TITLE, DEFAULT_TIME_MINUTES, DEFAULT_OUTLINE, DEFAULT_SCRIPTS);
        setShowModal(false);
        showToast("Reset talk to default transcript.");
      };

      const handleExportBackup = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({
          talkTitle, totalMinutes, outline, scripts
        }, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `Talk_Backup_${talkTitle.replace(/[^a-z0-9]/gi, '_').toLowerCase()}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
      };

      const handleImportBackup = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            if (parsed.outline && parsed.scripts) {
              setTalkTitle(parsed.talkTitle || DEFAULT_TALK_TITLE);
              setTotalMinutes(parsed.totalMinutes || DEFAULT_TIME_MINUTES);
              setOutline(parsed.outline);
              setScripts(parsed.scripts);
              persistState(parsed.talkTitle || DEFAULT_TALK_TITLE, parsed.totalMinutes || DEFAULT_TIME_MINUTES, parsed.outline, parsed.scripts);
              showToast("Backup successfully imported!");
            }
          } catch (err) {
            showToast("Invalid JSON backup file.");
          }
        };
        reader.readAsText(file);
      };

      const handleJumpToScript = (sectionId) => {
        setViewMode('script');
        setTimeout(() => {
          const el = document.getElementById(sectionId);
          if (el) {
            const y = el.getBoundingClientRect().top + window.scrollY - 100;
            window.scrollTo({ top: y, behavior: 'smooth' });
            
            el.classList.add('bg-slate-800');
            setTimeout(() => el.classList.remove('bg-slate-800'), 1500);
          }
        }, 100);
      };

      return (
        <div className="relative min-h-screen">
          
          {/* Toast Notification */}
          {toastMsg && (
            <div className="fixed bottom-6 right-6 z-50 bg-emerald-600 text-white px-5 py-3 rounded-xl shadow-2xl flex items-center space-x-2 animate-bounce text-sm font-semibold">
              <CheckCircle2 className="w-5 h-5"/>
              <span>{toastMsg}</span>
            </div>
          )}

          {/* Top Sticky Bar */}
          <div className="fixed top-0 left-0 right-0 z-50 bg-slate-900/95 backdrop-blur-md border-b border-slate-800 px-3 sm:px-6 py-2.5 flex justify-between items-center shadow-xl">
            <PresentationTimer totalMinutes={totalMinutes} setTotalMinutes={setTotalMinutes} />

            {/* Actions: Edit Mode & View Switcher */}
            <div className="flex items-center space-x-2">
              <button 
                onClick={() => setIsEditMode(!isEditMode)}
                className={`p-2 sm:px-4 sm:py-2 rounded-full font-bold text-xs sm:text-sm flex items-center transition-all ${isEditMode ? 'bg-amber-500 text-slate-900 shadow-lg' : 'bg-slate-800 text-slate-300 border border-slate-700 hover:text-white'}`}
                title="Toggle Edit Mode"
              >
                <Edit3 className="w-4 h-4 sm:mr-1.5" />
                <span className="hidden sm:inline">{isEditMode ? 'Editing On' : 'Edit Talk'}</span>
              </button>

              <div className="bg-slate-800 border border-slate-700 p-1 rounded-full flex shadow-inner">
                <button 
                  onClick={() => { window.scrollTo({top:0}); setViewMode('mindmap'); }} 
                  className={`px-3 sm:px-5 py-1.5 rounded-full font-bold text-xs sm:text-sm flex items-center transition-colors ${viewMode === 'mindmap' ? 'bg-slate-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'}`}
                >
                  <Network className="w-4 h-4 sm:mr-1.5" /> <span className="hidden sm:inline">Mind Map</span>
                </button>
                <button 
                  onClick={() => { window.scrollTo({top:0}); setViewMode('script'); }} 
                  className={`px-3 sm:px-5 py-1.5 rounded-full font-bold text-xs sm:text-sm flex items-center transition-colors ${viewMode === 'script' ? 'bg-slate-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'}`}
                >
                  <FileText className="w-4 h-4 sm:mr-1.5" /> <span className="hidden sm:inline">Script</span>
                </button>
              </div>
            </div>
          </div>

          <div className="pt-24 sm:pt-28">

            {/* Toolbar row when editing */}
            {isEditMode && (
              <div className="max-w-4xl mx-auto px-4 mb-6 bg-slate-800/80 border border-amber-500/40 rounded-2xl p-4 flex flex-wrap justify-between items-center gap-3">
                <div className="text-amber-400 text-xs sm:text-sm font-semibold flex items-center gap-1.5">
                  <Edit3 className="w-4 h-4"/> Editing active. Changes auto-save on your device.
                </div>
                <div className="flex items-center gap-2">
                  <button 
                    onClick={handleExportBackup} 
                    className="bg-slate-700 hover:bg-slate-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1"
                  >
                    <Download className="w-3.5 h-3.5"/> Export
                  </button>
                  <label className="bg-slate-700 hover:bg-slate-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1 cursor-pointer">
                    <Upload className="w-3.5 h-3.5"/> Import
                    <input type="file" accept=".json" onChange={handleImportBackup} className="hidden" />
                  </label>
                  <button 
                    onClick={() => setShowModal(true)} 
                    className="bg-rose-900/50 hover:bg-rose-900/80 text-rose-300 border border-rose-700/50 px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1"
                  >
                    <RefreshCw className="w-3.5 h-3.5"/> Reset Original
                  </button>
                </div>
              </div>
            )}

            {viewMode === 'mindmap' ? (
              <div className="max-w-4xl mx-auto px-4 pb-40 sm:px-8">
                
                {/* Header */}
                <div className="text-center mb-12 space-y-3">
                  {isEditMode ? (
                    <div className="space-y-3 max-w-lg mx-auto">
                      <input 
                        type="text"
                        value={talkTitle}
                        onChange={(e) => {
                          setTalkTitle(e.target.value);
                          persistState(e.target.value, totalMinutes, outline, scripts);
                        }}
                        className="w-full text-center text-2xl sm:text-3xl font-extrabold bg-slate-800 border border-slate-700 rounded-xl p-2 text-white focus:ring-2 focus:ring-amber-500 focus:outline-none"
                      />
                      <div className="flex items-center justify-center gap-2 text-sm text-slate-400">
                        <span>Target Duration (Minutes):</span>
                        <input 
                          type="number" 
                          min="1" 
                          max="60"
                          value={totalMinutes}
                          onChange={(e) => {
                            const val = parseInt(e.target.value) || 10;
                            setTotalMinutes(val);
                            persistState(talkTitle, val, outline, scripts);
                          }}
                          className="w-16 text-center bg-slate-800 border border-slate-700 rounded-lg p-1 text-white font-bold"
                        />
                      </div>
                    </div>
                  ) : (
                    <>
                      <h1 className="text-3xl sm:text-5xl font-extrabold text-white tracking-tight">
                        {talkTitle}
                      </h1>
                      <p className="text-slate-400 text-sm sm:text-lg max-w-2xl mx-auto">
                        Speak from the heart. Tap a bubble to pop it. <br/> 
                        <strong className="text-slate-300">Press & Hold 1.2s to jump directly to the script.</strong>
                      </p>
                    </>
                  )}
                </div>

                {/* Talk Sections */}
                <div className="space-y-12">
                  {outline.map((section) => (
                    <div key={section.id} className="relative">
                      
                      {/* Section Header */}
                      <div className="flex justify-center mb-6 sticky top-24 z-20">
                        <div className={`bg-gradient-to-r ${section.themeColor} text-white font-black text-base sm:text-xl px-5 py-2.5 rounded-2xl shadow-xl uppercase tracking-wider flex items-center justify-center gap-2.5 w-full sm:w-auto`}>
                           <BookOpen className="w-5 h-5 opacity-90 flex-shrink-0" />
                          <span>{section.sectionTitle}</span>
                        </div>
                      </div>

                      {/* Bubbles */}
                      <div className="flex flex-col items-center space-y-4">
                        {section.cards.map((card) => (
                          <FlashcardBubble 
                            key={card.id}
                            card={card} 
                            textColor={section.textColor}
                            borderColor={section.borderColor}
                            lightBg={section.lightBg}
                            onJumpToScript={handleJumpToScript}
                            isEditMode={isEditMode}
                            onUpdateCard={handleUpdateCard}
                            onDeleteCard={handleDeleteCard}
                          />
                        ))}

                        {isEditMode && (
                          <button 
                            onClick={() => handleAddCard(section.id)}
                            className="bg-slate-800 border border-dashed border-slate-600 hover:border-amber-500 text-slate-300 hover:text-amber-400 px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 transition-colors my-2"
                          >
                            <Plus className="w-4 h-4"/> Add Point to {section.id}
                          </button>
                        )}
                      </div>
                      
                    </div>
                  ))}
                </div>
              </div>
            ) : (
              <FullScriptView 
                outline={outline} 
                scripts={scripts} 
                isEditMode={isEditMode}
                onUpdateScript={handleUpdateScript}
                talkTitle={talkTitle}
              />
            )}
          </div>

          {/* Reset Modal */}
          {showModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm">
              <div className="bg-slate-800 border border-slate-700 rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl">
                <h3 className="text-xl font-bold text-white">Reset Talk Transcript?</h3>
                <p className="text-slate-300 text-sm">
                  This will restore the talk outline and script back to the original default version. All custom edits will be erased.
                </p>
                <div className="flex justify-end space-x-3 pt-2">
                  <button 
                    onClick={() => setShowModal(false)}
                    className="px-4 py-2 rounded-xl text-slate-400 hover:text-white font-semibold text-sm"
                  >
                    Cancel
                  </button>
                  <button 
                    onClick={handleResetDefault}
                    className="px-4 py-2 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-bold text-sm shadow-lg"
                  >
                    Yes, Reset Everything
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
